<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FocusFlow Cockpit</title>
  <style>
    body { width: 340px; margin: 0; padding: 16px; background: #0b0f19; color: #f8fafc; font-family: sans-serif; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 14px; }
    .title { color: #00f2fe; font-weight: bold; font-size: 16px; }
    .card { background: #172033; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .card-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
    .val { font-size: 20px; font-weight: bold; color: #00f2fe; margin-top: 4px; }
    .btn { width: 100%; padding: 10px; background: #00f2fe; color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ FocusFlow Extension</div>
    <span style="color:#22c55e; font-size:12px;">● Active</span>
  </div>

  <div class="card">
    <div class="card-title">Last Spatial Position</div>
    <div id="last-context" style="font-size:12px; color:#cbd5e1; margin-top:6px;">No position saved yet.</div>
  </div>

  <div class="card">
    <div class="card-title">Saved Dwell Anchors</div>
    <div class="val" id="dwell-count">0</div>
  </div>

  <button class="btn" onclick="openVercelHub()">Open Enterprise Hub (Vercel) 🚀</button>
  <script src="dashboard.js"></script>
</body>
</html>
